name: Publish to npm

# Runs when a GitHub release is published. The tag must be v<package.json version>, e.g. v0.2.1.
# Authentication: npm trusted publishing (OIDC), configured on npmjs.com for this repo and workflow.
# Publishing from GitHub Actions adds an npm provenance statement, which n8n requires for
# verified community nodes. A release whose version is already on npm skips the publish step.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # No registry-url above: setup-node would write a placeholder token into .npmrc,
      # and npm would send it instead of using trusted publishing (OIDC).
      - name: Use an npm version that supports trusted publishing
        run: npm install -g npm@11
      - name: Check tag matches package.json version
        if: github.event_name == 'release'
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "${{ github.event.release.tag_name }}" ]; then
            echo "Release tag ${{ github.event.release.tag_name }} does not match package.json $VERSION"
            exit 1
          fi
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Skip if this version is already on npm
        id: exists
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already published, nothing to do."
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish with provenance
        if: steps.exists.outputs.published != 'true'
        run: npm publish --access public --provenance
        env:
          RELEASE_MODE: "true"
